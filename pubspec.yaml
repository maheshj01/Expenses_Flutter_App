name: three_bucks
description: "Offline-first personal expense tracker."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  app_links: ^7.2.2
  cloud_firestore: ^7.2.0
  cloud_functions: ^7.1.0
  collection: ^1.19.1
  connectivity_plus: ^7.3.2
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  excel: ^4.0.6
  file_picker: ^13.4.0
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_email_sender: ^11.2.0
